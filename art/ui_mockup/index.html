<meta charset="utf-8">
<title>Downfall 界面原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Saira:wdth,wght@75..125,400..900&display=swap">
<style>
/* Layout: one fixed 1280x720 game viewport (Godot reference size) scaled to fit; screen picker above, design notes below.
   Look: Arknights client UI — battle HUD (blue HP / yellow SP, cost counter + deploy cards), sub-page shell
   (back/home pill, currency pills, wide English watermark), Integrated Strategies top bar and node map, stage-detail panel. */
:root{
  color-scheme:dark;
  --bg:#161616;  --plate:rgba(24,24,24,.86);  --plate-s:#202020;  --plate-2:#2c2c2c;  --plate-3:#383838;
  --line:#3a3a3a; --line-2:#5a5a5a;
  --fg:#f4f4f4;  --mute:#a3a3a3;  --dim:#6d6d6d;  --ink:#101010;  --paper:#e9e9e9;
  --blue:#0098dc;   /* confirm / 开始行动 / selected */
  --hp:#27a6ef;     /* ally HP */
  --sp:#f5c000;     /* skill points, skill ready, stars */
  --red:#e23c3c;    /* enemy, elite, failure */
  --ori:#e0782a;    /* contamination and originium only */
  --green:#8fc31f;  /* extraction, kept */
  --t0:#9a9a9a; --t1:#16a2e8; --t2:#ffc400; --sp-item:#c48cff;   /* item tiers: 普通 / 精良 / 稀有 / 特殊 */
  --f-cn:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  --f-en:"Saira","Bahnschrift","Arial",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b0b0b;color:var(--fg);font-family:var(--f-cn);font-size:14px}
button{font-family:inherit}
.page{padding-inline:16px;padding-block:18px 40px;max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand small{display:block;font:600 11px var(--f-en);font-stretch:125%;color:var(--mute);letter-spacing:.2em}
.brand h1{margin:2px 0 0;font:900 26px var(--f-cn);letter-spacing:.04em;text-wrap:balance}
.brand h1 span{font:800 26px var(--f-en);font-stretch:125%;letter-spacing:.06em;margin-right:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
nav.picker{display:flex;flex-wrap:wrap;gap:14px 22px}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp>span{font:600 10.5px var(--f-en);font-stretch:125%;color:var(--mute);letter-spacing:.2em}
.grp div{display:flex;flex-wrap:wrap;gap:4px}
.pick{font:500 13px var(--f-cn);color:var(--fg);background:var(--plate-s);border:0;border-bottom:2px solid transparent;padding:6px 11px;cursor:pointer}
.pick:hover{background:var(--plate-2)}
.pick[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
:focus-visible{outline:2px solid var(--sp);outline-offset:2px}
.stage-wrap{width:100%;position:relative;background:#000;overflow:hidden}
.stage{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#111 center/cover no-repeat;image-rendering:pixelated;user-select:none}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{background:var(--plate-s);padding:12px 14px;min-width:0;border-top:2px solid var(--line-2)}
.note h3{margin:0 0 6px;font:700 11px var(--f-en);font-stretch:125%;letter-spacing:.2em;color:var(--sp)}
.note p{margin:0;line-height:1.7;color:#cfcfcf;font-size:13px}
.hint{font-size:12px;color:var(--mute);margin:0}
.hint kbd{font:600 11px var(--f-en);background:var(--plate-2);padding:1px 5px;color:var(--fg)}

/* ================= in-game kit ================= */
.stage *{image-rendering:auto}
.stage img.px{image-rendering:pixelated}
.abs{position:absolute}
.en{font-family:var(--f-en);font-stretch:125%;letter-spacing:.12em;font-weight:700}
.num{font-family:var(--f-en);font-stretch:100%;font-weight:700;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .dimc{color:var(--dim)}
.b{color:var(--hp)} .y{color:var(--sp)} .rd{color:var(--red)} .o{color:var(--ori)} .g{color:var(--green)}
.q0{color:#d0d0d0} .q1{color:#5cc4ff} .q2{color:var(--t2)} .qs{color:var(--sp-item)}
.plate{background:var(--plate)}
.wplate{background:var(--paper);color:var(--ink)}
.stars{color:var(--sp);letter-spacing:-1px;text-shadow:0 0 6px rgba(245,192,0,.35)}
.wm{position:absolute;font:900 150px/0.8 var(--f-en);font-stretch:125%;letter-spacing:.02em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.07);pointer-events:none;white-space:nowrap}
.slash{background:repeating-linear-gradient(-60deg,rgba(255,255,255,.08) 0 2px,transparent 2px 7px)}
.geo{background:
  linear-gradient(115deg,transparent 0 62%,rgba(255,255,255,.025) 62% 63%,transparent 63%),
  linear-gradient(115deg,transparent 0 70%,rgba(255,255,255,.03) 70% 78%,transparent 78%),
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0) 0 0/16px 16px,
  #1a1a1a}
.brk{--bc:var(--sp);background:
 linear-gradient(var(--bc),var(--bc)) 0 0/12px 2px no-repeat, linear-gradient(var(--bc),var(--bc)) 0 0/2px 12px no-repeat,
 linear-gradient(var(--bc),var(--bc)) 100% 0/12px 2px no-repeat, linear-gradient(var(--bc),var(--bc)) 100% 0/2px 12px no-repeat,
 linear-gradient(var(--bc),var(--bc)) 0 100%/12px 2px no-repeat, linear-gradient(var(--bc),var(--bc)) 0 100%/2px 12px no-repeat,
 linear-gradient(var(--bc),var(--bc)) 100% 100%/12px 2px no-repeat, linear-gradient(var(--bc),var(--bc)) 100% 100%/2px 12px no-repeat}
.bar{position:relative;height:6px;background:rgba(0,0,0,.75)}
.bar>i{position:absolute;inset:0 auto 0 0;display:block}
.seg{display:flex;gap:2px}.seg i{flex:1;height:100%;background:rgba(255,255,255,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;background:var(--plate);font-size:13px}
.chip svg{width:16px;height:16px}
.tagw{display:inline-block;background:var(--paper);color:var(--ink);font:800 10.5px var(--f-cn);padding:1px 6px;letter-spacing:.04em}
.tagd{display:inline-block;background:var(--plate-3);color:var(--fg);font:700 10.5px var(--f-cn);padding:1px 6px}
.tagc{display:inline-block;font:800 10.5px var(--f-cn);padding:1px 6px;color:var(--ink)}
.btn{font:700 14px var(--f-cn);color:var(--fg);background:var(--plate-3);border:0;padding:9px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.15)}
.btn.blue{background:var(--blue)}
.btn.yel{background:var(--sp);color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed;filter:none}
.btn .en{font-size:10px;opacity:.8}
.go{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;background:var(--blue);color:#fff;border:0;cursor:pointer;padding:0 22px;position:relative;overflow:hidden}
.go b{font:900 24px var(--f-cn);letter-spacing:.2em}
.go small{font:700 10px var(--f-en);font-stretch:125%;letter-spacing:.3em;opacity:.85}
.go::after{content:"";position:absolute;right:-20px;top:0;bottom:0;width:90px;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.18) 0 3px,transparent 3px 9px)}
.go[disabled]{background:#3a3a3a;color:#888;cursor:not-allowed}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;padding:0 4px;background:#000;color:#fff;font:700 10px var(--f-en)}
.dim{position:absolute;inset:0;background:rgba(8,8,8,.74)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.sec{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:900 13px var(--f-cn)}
.sec::before{content:"";width:4px;height:13px;background:var(--fg)}
.sec em{font:700 9.5px var(--f-en);font-stretch:125%;letter-spacing:.2em;color:var(--dim);font-style:normal}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0;font-size:13px}
.kv>div{display:contents}
.kv span{padding:6px 10px;border-bottom:1px solid var(--line)}
.kv span:nth-child(even){text-align:right;font:700 15px var(--f-en);font-variant-numeric:tabular-nums}
.up{color:#9fe04a}.dn{color:var(--red)}
.cls{width:40px;height:40px;background:#000;display:grid;place-items:center;flex:none}
.cls svg{width:26px;height:26px}

/* page shell (AK sub-page) */
.shell{position:absolute;inset:0;display:flex;flex-direction:column}
.shtop{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 0 0 14px;position:relative;z-index:2}
.navp{display:flex;height:38px;background:#000}
.navp button{width:46px;border:0;background:#000;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.navp button+button{border-left:1px solid #333;width:60px}
.navp svg{width:18px;height:18px}
.pt{display:flex;flex-direction:column;line-height:1.05}
.pt small{font:700 10px var(--f-en);font-stretch:125%;letter-spacing:.32em;color:var(--mute)}
.pt b{font:900 22px var(--f-cn);letter-spacing:.06em}
.tabs{display:flex;gap:2px;margin-left:12px;align-self:stretch;align-items:flex-end;padding-bottom:10px}
.tab{border:0;background:transparent;color:var(--mute);font:700 13px var(--f-cn);padding:6px 14px;cursor:pointer;position:relative}
.tab.on{color:var(--ink);background:var(--paper)}
.curs{margin-left:auto;display:flex;gap:6px;padding-right:14px}
.cur{display:flex;align-items:center;height:30px;background:rgba(0,0,0,.72);font:700 14px var(--f-en);padding-left:8px}
.cur i{width:16px;height:16px;margin-right:8px;display:grid;place-items:center;font-style:normal}
.cur .v{min-width:56px;text-align:right;padding-right:8px}
.cur .p{width:24px;height:30px;background:var(--paper);color:var(--ink);display:grid;place-items:center;font:900 15px var(--f-en)}
.shbody{flex:1;min-height:0;display:flex;gap:16px;padding:6px 16px 0;position:relative;z-index:1}
.shfoot{height:34px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:12px;color:var(--mute);position:relative;z-index:1}
.shfoot .kbd{margin-right:4px}

/* item tile (AK depot style) */
.grid{position:relative;background:rgba(0,0,0,.55);background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:36px 36px;background-position:-1px -1px}
.it{position:absolute;display:grid;place-items:center;cursor:pointer;--rc:var(--t0);
 background:linear-gradient(0deg,color-mix(in srgb,var(--rc) 55%,transparent) 0,transparent 62%),#2b2b2b;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.it::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.it.q1{--rc:var(--t1)}.it.q2{--rc:var(--t2)}.it.qs{--rc:var(--sp-item)}
.it img{image-rendering:pixelated;position:relative;z-index:1}
.it:hover,.it.sel{outline:2px solid var(--fg);outline-offset:-1px;z-index:3}
.it .st{position:absolute;right:0;bottom:3px;background:#000;color:#fff;font:700 11px var(--f-en);padding:0 4px;z-index:2}
.it .badge{position:absolute;left:2px;top:2px;width:10px;height:10px;z-index:2}
.it .t{font:700 11.5px var(--f-cn);position:relative;z-index:1;text-shadow:0 1px 2px #000}
.b-ins{background:var(--hp);clip-path:polygon(50% 0,100% 20%,90% 70%,50% 100%,10% 70%,0 20%)}
.b-reg{background:var(--ori);transform:rotate(45deg) scale(.7)}
.b-lock{background:var(--green);clip-path:polygon(20% 40%,20% 20%,35% 5%,65% 5%,80% 20%,80% 40%,100% 40%,100% 100%,0 100%,0 40%,35% 40%,35% 25%,65% 25%,65% 40%)}

/* AK item detail */
.idt{background:var(--plate-s);font-size:12.5px}
.idt .hd{display:flex;gap:12px;padding:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 30%,transparent),transparent 70%);position:relative}
.idt .hd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rc)}
.idt .ic{width:76px;height:76px;flex:none;display:grid;place-items:center;background:linear-gradient(0deg,color-mix(in srgb,var(--rc) 55%,transparent),transparent 65%),#2b2b2b;border-bottom:3px solid var(--rc)}
.idt .ic img{max-width:70px;max-height:70px;image-rendering:pixelated}
.idt .nm{font:900 17px var(--f-cn)}
.idt .bd{padding:10px 14px 14px;display:flex;flex-direction:column;gap:7px}
.idt .row{display:flex;justify-content:space-between;gap:8px}
.idt .row .num{font-size:14px}
.idt .afx{color:#9fd8ff}
.idt .lbl{font:700 9.5px var(--f-en);font-stretch:125%;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.idt .fl{font-style:italic;color:var(--mute);line-height:1.6}
.grid.dead .it{filter:grayscale(.8);opacity:.38}
.grid.dead .it[data-it="yan"],.grid.dead .it[data-it="eq-武器"],.grid.dead .it[data-it="lgd"]{filter:none;opacity:1}
.z2 .it .t{font-size:8px}
.z2 .it .st{font-size:7px}
.ftag{position:absolute;z-index:5;font:800 7px var(--f-cn);color:#111;padding:0 2px;line-height:10px;pointer-events:none}
.fg{color:var(--fg)}
.win{position:absolute;top:0;bottom:0;background:rgba(16,16,16,.97);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line-2),0 0 40px rgba(0,0,0,.6);z-index:10}
.wtop{height:52px;flex:none;display:flex;align-items:center;padding:0 0 0 16px;border-bottom:1px solid var(--line);background:#0c0c0c}
.wx{width:52px;height:52px;border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer;margin-left:8px}
.wx:hover{background:var(--red)}
.wbody{flex:1;min-height:0;overflow:auto}
.it.qp{--rc:#8fc31f}
.idt.ft{width:270px;box-shadow:0 0 0 1px var(--line-2),0 10px 28px rgba(0,0,0,.7)}

/* battle HUD */
.card{position:relative;width:64px;height:82px;background:linear-gradient(180deg,#3b3b3b,#1d1d1d);cursor:pointer;overflow:hidden}
.card .cost{position:absolute;right:0;top:0;min-width:20px;height:18px;background:#000;color:#fff;font:800 13px var(--f-en);display:grid;place-items:center;padding:0 3px;z-index:3}
.card .ico{position:absolute;inset:6px 6px 22px 6px;display:grid;place-items:center}
.card .ico svg{width:34px;height:34px}
.card .kb{position:absolute;left:0;right:0;bottom:3px;height:19px;background:rgba(0,0,0,.65);font:700 11px var(--f-cn);display:flex;align-items:center;justify-content:center;gap:4px}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--cc,#9a9a9a)}
.card .cdv{position:absolute;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;font:800 18px var(--f-en);z-index:2}
.card.ready{box-shadow:0 0 0 2px var(--sp),0 0 14px rgba(245,192,0,.5)}
.unitbar{position:absolute;transform:translateX(-50%);width:54px;display:flex;flex-direction:column;gap:1px;pointer-events:none}
.unitbar .bar{height:5px;background:rgba(0,0,0,.8)}
.ready-ic{position:absolute;transform:translate(-50%,-100%);width:22px;height:22px;background:var(--sp);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:grid;place-items:center;font:900 12px var(--f-en);color:var(--ink)}
.eplate{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.ehp{position:relative;width:40px;height:3px;background:rgba(0,0,0,.85)}
.ehp>i{position:absolute;inset:0 auto 0 0;background:var(--red)}
.ehp.elite{width:64px;height:6px;box-shadow:0 0 0 1px #000,0 0 0 2px #b8862e;background:#1a0606}
.ehp.elite>i{background:linear-gradient(180deg,#ff6a5a,#c4231c)}
.ehp.elite::before{content:"★";position:absolute;right:calc(100% + 5px);top:50%;transform:translateY(-52%);font:900 13px/1 var(--f-en);color:#f5c000;text-shadow:0 0 0 #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.dmg{position:absolute;font:800 22px var(--f-en);text-shadow:0 2px 0 #000;pointer-events:none;animation:rise 1.3s ease-out infinite}
@keyframes rise{0%{transform:translateY(6px);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 2px var(--sp),0 0 22px rgba(245,192,0,.75)}}
@media (prefers-reduced-motion:reduce){.dmg,.pulse,.spin{animation:none!important}}
.grade{width:34px;display:flex;flex-direction:column;align-items:center;gap:1px}
.grade b{width:26px;height:26px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:900 17px var(--f-en)}
.grade span{font-size:10px;color:var(--mute)}
.buff{position:relative;width:28px;height:28px;background:#000;display:grid;place-items:center;font:900 12px var(--f-cn);box-shadow:inset 0 -2px 0 var(--bc,#777)}
.buff i{position:absolute;right:-2px;bottom:-6px;background:#000;font:700 9.5px var(--f-en);font-style:normal;padding:0 2px}
.log{font-size:12px;line-height:1.6}
.log p{margin:0}
.log .t{font:600 10.5px var(--f-en);color:var(--dim);margin-right:6px}
.toast{display:flex;align-items:center;gap:8px;height:30px;padding-left:40px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.78) 30%);font-size:12.5px;justify-content:flex-end}
.toast .mini{width:26px;height:26px;position:relative;flex:none}
.mm-dot{position:absolute;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg)}
.relic{width:64px;height:64px;position:relative;display:grid;place-items:center;font:900 22px var(--f-cn);background:radial-gradient(circle at 50% 38%,#3a3a3a,#141414 72%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.relic.r0{color:#e6e6e6}.relic.r1{color:#5cc4ff}.relic.r2{color:var(--t2)}
.relic::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:currentColor}
.toggle{display:inline-flex;background:#000}
.toggle button{background:none;border:0;color:var(--mute);font:700 12px var(--f-cn);padding:6px 12px;cursor:pointer}
.toggle button.on{background:var(--blue);color:#fff}
input.srch{background:#000;border:0;border-bottom:2px solid var(--line-2);color:var(--fg);font:13px var(--f-cn);padding:6px 10px;width:280px}
.rng{width:100%;accent-color:var(--blue)}
.node{position:absolute;width:132px;height:58px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--plate-2);cursor:pointer;border:0;color:var(--fg);text-align:left;transform:translate(-50%,-50%)}
.node .ni{width:34px;height:34px;display:grid;place-items:center;background:#000;flex:none}
.node .ni svg{width:22px;height:22px}
.node b{font:900 13px var(--f-cn);display:block}
.node small{font:700 9px var(--f-en);font-stretch:125%;letter-spacing:.16em;color:var(--mute)}
.node.done{opacity:.42;cursor:default}
.node.sel{outline:2px solid var(--sp);outline-offset:3px}
.band{position:absolute;left:0;right:0;background:rgba(18,18,18,.96);box-shadow:0 -1px 0 var(--line-2),0 1px 0 var(--line-2)}
.spin{animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>

<div class="page">
  <header class="top">
    <div class="brand">
      <small>RHODES ISLAND · FIELD CONTRACTS · UI PROTOTYPE V2 · 1280×720</small>
      <h1><span>DOWNFALL</span>界面原型</h1>
    </div>
    <div class="legend" aria-label="颜色用途">
      <span><i style="background:var(--blue)"></i>蓝 · 确认 / 开始行动 / 我方生命</span>
      <span><i style="background:var(--sp)"></i>黄 · 技力 / 可领取 / 星级</span>
      <span><i style="background:var(--red)"></i>红 · 敌方 / 精英 / 失败</span>
      <span><i style="background:var(--ori)"></i>橙 · 只给污染与源石</span>
      <span><i style="background:var(--green)"></i>绿 · 撤离 / 保留</span>
    </div>
  </header>
  <nav class="picker" id="picker" aria-label="选择界面"></nav>
  <div class="stage-wrap" id="wrap"><div class="stage" id="stage" tabindex="0" aria-label="游戏画面原型"></div></div>

  const b=$('#bag'); if(!b) return; b.innerHTML=ITEMS.map(t=>tile(t)).join('');

    <div style="display:flex;gap:6px"><span class="tagc" style="background:var(--sp)">订单 2</span><span class="tagc" style="background:var(--ori)">污染 轻度</span></div>
    <button class="go pulse" style="margin-top:auto;height:84px;width:100%"><b>开始行动</b><small>OPERATION START</small></button>
  </div>`, keys:[['Esc','返回']]}),

  note:{mmo:'进副本前的准备页：自身装备与消耗品。', prts:'照编队界面：左边一张大干员卡（职业图标、五星、底部稀有度色）、中间装备与背包（药剂占格子）、右侧部署目标栏和最醒目的蓝色“开始行动”。', data:'show_departure 的投保与带入背包；基地投保用龙门币，价格为物品价值的 100%，阵亡后必定送达（随机 1–3 份合同后）。'}};

  <div class="abs" style="left:0;right:0;top:250px;text-align:center">

  </div>

  note:{mmo:'MMO 加载屏：提示 + 进度。', prts:'点下“开始行动”后的过场：黑底细斜线、居中“行动开始 / OPERATION START”，左下黄色 TIPS 牌加作战提示，右下转动的舰徽和加载文字。', data:'进度对应地图生成步骤（地形、导航、敌人、装置）。'}};

S.title = {grp:'系统', name:'标题画面', bg:'base_hall', html:()=>`<div class="abs" style="inset:0;background:linear-gradient(0deg,rgba(6,6,6,.95),rgba(6,6,6,.45) 55%,rgba(6,6,6,.75))"></div>
  <div class="abs" style="left:0;right:0;top:190px;text-align:center">
    <div class="en mute" style="font-size:12px;letter-spacing:.5em">RHODES ISLAND · FIELD CONTRACTS</div>
    <div class="en" style="font-size:92px;font-weight:900;letter-spacing:.14em;line-height:1.05">DOWNFALL</div>

/* ---------------- behaviour ---------------- */
function bindTips(first){
  const all=[...ITEMS,...SAFE,...Object.values(EQUIP),...ITEMS.slice(9).map(t=>({...t,id:t.id+'2',stack:t.stack+7}))];
  $$('[data-it]').forEach(el=>el.onmouseenter=()=>{const it=all.find(t=>t.id===el.dataset.it); if(it&&$('#tipbox')){$('#tipbox').innerHTML=detail(it,cmpRows(it)); $$('.it.sel').forEach(x=>x.classList.remove('sel')); el.classList.add('sel');}});
  const f=first&&document.querySelector(`[data-it="${first}"]`); f&&f.onmouseenter();
}
function toggles(){ $$('.toggle').forEach(t=>t.querySelectorAll('button').forEach(b=>{ if(!b.dataset.sm) b.addEventListener('click',()=>t.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))); })); $$('[data-tabx]').forEach(b=>b.addEventListener('click',()=>b.parentNode.querySelectorAll('[data-tabx]').forEach(x=>x.classList.toggle('on',x===b)))); }
function pickInit(cb){ $$('[data-o]').forEach(b=>b.addEventListener('click',()=>{ $$('[data-o]').forEach(x=>{x.classList.toggle('brk',x===b); x.classList.toggle('sel',x===b);}); const t=$('#takeOffer'); if(t) t.disabled=false; cb&&cb(+b.dataset.o); })); }

const LOG=[['13:58:02','进入 LG-04 · 龙门 · 下城区废墟。'],['13:58:30','本层发现撤离点。'],['13:59:31','机关 2 / 4 已触发。'],['14:00:40','附近发现<span style="color:#5fd0d8">罗德岛小队</span>。']];
function drawLog(){ const el=$('#log'); if(!el) return; el.innerHTML=LOG.map(l=>`<p><span class="t">${l[0]}</span>${l[1]}</p>`).join(''); el.scrollTop=1e4; }
function pushLog(k,c,t){ if(k!=='PRTS') return; LOG.push([new Date().toTimeString().slice(0,8),t]); if(LOG.length>40) LOG.shift(); drawLog(); }
function drawUnit(){
  if(!$('#ubar')) return;
  const low=P.hp/P.max<.3, ready=P.charge>=P.need;
  $('#ubar').innerHTML=bar(P.hp/P.max*100,low?'var(--red)':'var(--hp)',5)+`<div class="seg" style="height:4px">${Array.from({length:P.need},(_,i)=>`<i style="background:${i<P.charge?'var(--sp)':'rgba(0,0,0,.8)'}"></i>`).join('')}</div>`;
  $('#uready').style.display=ready?'grid':'none';
  $('#c-wave').classList.toggle('ready',ready); $('#c-wave').classList.toggle('pulse',ready); $('#wavecost').textContent=ready?'就绪':`${P.charge}/${P.need}`;
  $('#stav').textContent=Math.round(P.sta); $('#stab').innerHTML=bar(P.sta,'#fff',3);
  const nb=ITEMS.filter(t=>t.pot===BOUND).length; $('#potbelt').textContent=POT[BOUND].s; $('#potbelt').style.opacity=nb?1:.3; $('#potn').textContent=nb;
}
function cdv(id,ms){ const c=$(id); if(!c) return; const v=document.createElement('span'); v.className='cdv'; c.appendChild(v); const t0=performance.now(); const f=t=>{const left=ms-(t-t0); if(left<=0||!document.contains(v)){v.remove();return;} v.textContent=(left/1000).toFixed(1); requestAnimationFrame(f);}; requestAnimationFrame(f); }
let potLock=0,dodgeLock=0;
function hudKey(k){
  if(k==='q'&&!potLock){ const it=ITEMS.find(t=>t.pot===BOUND); if(it){ drink(it); potLock=1; cdv('#c-pot',1500); setTimeout(()=>potLock=0,1500); drawBag(); } }
  if(k==='shift'&&!dodgeLock&&P.sta>=30){ P.sta-=30; dodgeLock=1; cdv('#c-dodge',800); setTimeout(()=>dodgeLock=0,800); }
  if(k==='1'){ if(P.charge>=P.need){P.charge=0;pushLog('战斗','b','<b>剑气</b> 命中 弩手组长，<b>'+(600+Math.round(Math.random()*200))+'</b>。');} else {P.charge++; pushLog('战斗','','连斩命中，<b>'+(380+Math.round(Math.random()*80))+'</b>。');} }
  drawUnit();
}
function hudInit(){
  drawLog(); drawUnit();

  $$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
  $('#c-atk').onclick=()=>hudKey('1'); $('#c-wave').onclick=()=>hudKey('1'); $('#c-pot').onclick=()=>hudKey('q'); $('#c-dodge').onclick=()=>hudKey('shift');
}
setInterval(()=>{ if(cur==='hud'&&P.sta<100){P.sta=Math.min(100,P.sta+4); if($('#stav')){$('#stav').textContent=Math.round(P.sta); $('#stab').innerHTML=bar(P.sta,'#fff',3);}} },200);

/* ---------------- routing ---------------- */
let cur='hud';
const FIELD=['hud','inv','relics','map','journal','offer','route','squad','shop','camp','settle','esc'];
function show(id){
  cur=id; const s=S[id];
  stage.style.backgroundImage = s.bg?`url(${IMG(s.bg)})`:'none';
  stage.innerHTML = s.html();
  s.init&&s.init();
  $$('[data-back],[data-home]').forEach(b=>b.onclick=()=>show(b.dataset.home!==undefined?(FIELD.includes(id)?'hud':'base'):(FIELD.includes(id)?'hud':'base')));
  $$('.pick').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===id));
  $('#notes').innerHTML = `<div class="note"><h3>MMO 骨架</h3><p>${s.note.mmo}</p></div><div class="note"><h3>方舟元素</h3><p>${s.note.prts}</p></div><div class="note"><h3>数据与规则</h3><p>${s.note.data}</p></div>`;
  try{ history.replaceState(null,'','#'+id);}catch(e){}
}
function buildPicker(){
  const g={}; Object.entries(S).forEach(([id,s])=>(g[s.grp]=g[s.grp]||[]).push([id,s.name]));
  $('#picker').innerHTML=Object.entries(g).map(([n,l])=>`<div class="grp"><span>${n}</span><div>${l.map(([id,t])=>`<button class="pick" data-s="${id}">${t}</button>`).join('')}</div></div>`).join('');
  $$('.pick').forEach(b=>b.onclick=()=>show(b.dataset.s));
}
function fit(){ const k=wrap.clientWidth/1280; stage.style.transform=`scale(${k})`; wrap.style.height=(720*k)+'px'; }
window.addEventListener('resize',fit);
const HOT={i:'inv',c:'inv',r:'relics',m:'map',j:'journal'};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k==='escape'){ show(cur==='hud'?'esc':FIELD.includes(cur)?'hud':(cur==='base'?'esc':'base')); e.preventDefault(); return; }
  if(HOT[k]&&FIELD.includes(cur)){ show(cur===HOT[k]?'hud':HOT[k]); return; }
  if(cur==='hud'&&['q','shift','1'].includes(k)) hudKey(k);
});
buildPicker(); fit();
const start=(location.hash||'').slice(1); show(S[start]?start:'hud');
</script>
