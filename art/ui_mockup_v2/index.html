<meta charset="utf-8">
<title>罗德岛舰内界面</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Saira:wdth,wght@100..125,400..800&display=swap">
<style>
/* 布局：上方页签切界面；1280×720 舞台按宽度等比缩放；舞台下方写这一屏的拆分说明。单一深色（舰内终端），白舱皮肤只在医疗界面里出现。 */
:root{
  color-scheme:dark;
  --hull0:#0f1316; --hull1:rgba(22,27,31,.93); --hull1s:#161b1f; --hull2:#1f262b; --hull3:#2a3238;
  --seam:#3b4146; --seamhi:#5a666e;
  --fg:#eef3f5; --mute:#9aa7ae; --dim:#5f6b72; --paper:#e4eaec; --ink:#11171a;
  --holo:#3fd2f2; --blue:#0098dc; --hazard:#e8b730; --sp:#f5c000; --hp:#27a6ef; --red:#e23c3c; --ori:#e0782a; --green:#8fc31f;
  --t0:#9a9a9a; --t1:#16a2e8; --t2:#ffc400; --special:#c48cff;
  --d-bridge:#3fd2f2; --d-eng:#e8b730; --d-log:#4b9be0; --d-med:#2fbfa6; --d-lab:#8fb8ff; --d-store:#ff5fa2;
  --med-bg:#d7dee1; --med-panel:#eef2f3; --med-ink:#1b2328; --med-line:#b9c5ca;
  --store-bg:#2a2523;
  --cn:"Noto Sans SC","Microsoft YaHei",sans-serif;
  --en:"Saira","Bahnschrift","Arial Narrow",sans-serif;
}
html,body{background:var(--hull0);color:var(--fg)}
body{font-family:var(--cn);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1{font:900 22px/1.2 var(--cn);margin:0 0 4px;text-wrap:balance}
h1 small{font:600 12px var(--en);font-stretch:125%;letter-spacing:.2em;color:var(--mute);margin-left:10px}
.lede{color:var(--mute);font-size:13px;margin:0 0 14px;max-width:70ch}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
nav button{font:700 13px var(--cn);color:var(--mute);background:var(--hull2);border:0;padding:8px 12px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
nav button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.frame{width:100%;max-width:1280px;aspect-ratio:16/9;position:relative;overflow:hidden;background:#000;outline:1px solid var(--seam)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;font-family:var(--cn)}
.note{max-width:1280px;margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.note div{background:var(--hull2);padding:10px 12px;font-size:13px;line-height:1.6;color:var(--mute);min-width:0}
.note b{color:var(--fg)}
.note em{font-style:normal;color:var(--holo)}

/* ---- 舞台内组件 ---- */
#stage *{box-sizing:border-box}
.abs{position:absolute}
.bgimg{position:absolute;inset:0;background-size:cover;image-rendering:pixelated}
.dim{position:absolute;inset:0;background:rgba(8,11,13,.42)}
.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.cut6{clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
.win{position:absolute;background:linear-gradient(135deg,var(--seamhi),var(--seam) 30%)}
.win>.in{position:absolute;inset:1px;background:var(--hull1)}
.win.solid>.in{background:var(--hull1s)}
.rivet{position:absolute;width:3px;height:3px;background:var(--seamhi)}
.tb{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:12px;padding-right:8px;background:rgba(10,14,16,.7)}
.tb .blk{width:6px;align-self:stretch;clip-path:polygon(0 10px,100% 0,100% 100%,0 100%)}
.tb .cnT{font:900 18px var(--cn)}
.tb .enT{font:600 10px var(--en);font-stretch:125%;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
.tb .grow{flex:1}
.tb .key{font:800 11px var(--en);background:var(--paper);color:var(--ink);padding:2px 6px}
.tb .x{width:32px;height:32px;display:grid;place-items:center;color:var(--mute);font-size:18px}
.tb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--dc) 0,var(--dc) 40%,transparent)}
.tabs{display:flex;gap:2px}
.tab{font:700 13px var(--cn);padding:6px 14px;background:var(--hull3);color:var(--mute)}
.tab.on{background:var(--paper);color:var(--ink)}
.sec{display:flex;align-items:center;gap:8px;font:900 14px var(--cn)}
.sec::before{content:"";width:4px;height:13px;background:var(--fg)}
.sec span{font:600 9px var(--en);font-stretch:125%;letter-spacing:.22em;color:var(--dim)}
.btn{display:inline-grid;place-items:center;font:700 13px var(--cn);background:var(--hull3);color:var(--fg);padding:0 14px;height:30px;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
.btn.blue{background:var(--blue)}
.btn.paper{background:var(--paper);color:var(--ink)}
.btn.haz{background:repeating-linear-gradient(135deg,#2a2410 0 8px,#3a3115 8px 16px);color:var(--hazard);outline:1px solid var(--hazard);outline-offset:-1px}
.go{position:absolute;background:var(--blue);display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.go::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.08) 22px 24px)}
.go b{font:900 26px var(--cn);position:relative}
.go i{font:700 10px var(--en);font-style:normal;letter-spacing:.3em;position:relative;display:block;text-align:center}
.grid{position:absolute;background-color:rgba(6,9,11,.75);background-image:linear-gradient(var(--seam) 1px,transparent 1px),linear-gradient(90deg,var(--seam) 1px,transparent 1px);background-size:40px 40px;outline:1px solid var(--seam)}
.it{position:absolute;display:grid;place-items:center}
.it img{image-rendering:pixelated;position:relative}
.it::before{content:"";position:absolute;inset:1px;background:linear-gradient(0deg,var(--tc) -40%,transparent 55%);opacity:.55}
.it::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:3px;background:var(--tc)}
.it .n{position:absolute;right:2px;bottom:5px;font:800 10px var(--en);background:#000;padding:0 3px;z-index:1}
.slot{position:absolute;background:var(--hull2);outline:1px solid var(--seam);outline-offset:-1px;display:grid;place-items:center}
.slot.on{outline-color:var(--tc);background:linear-gradient(0deg,color-mix(in srgb,var(--tc) 30%,transparent),var(--hull2) 60%)}
.slot img{image-rendering:pixelated}
.slot svg{opacity:.35}
.slot .cap{position:absolute;left:4px;top:3px;font:700 10px var(--cn);color:var(--dim)}
.slot .ins{position:absolute;right:3px;top:3px;width:12px;height:12px;background:#4fd1c5;clip-path:polygon(50% 0,100% 25%,100% 60%,50% 100%,0 60%,0 25%)}
.stat{display:flex;justify-content:space-between;font:400 13px var(--cn);color:var(--mute);height:22px;align-items:center}
.stat b{font:700 13px var(--en);color:var(--fg);font-variant-numeric:tabular-nums}
.stat b small{color:var(--green);font-size:12px;margin-left:4px}
.lbl{font:400 12px var(--cn);color:var(--mute)}
.num{font-family:var(--en);font-variant-numeric:tabular-nums;font-weight:700}
.hb{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:flex-end}
.hb .s{width:58px;height:58px;background:rgba(12,16,19,.85);outline:1px solid var(--seam);position:relative;display:grid;place-items:center}
.hb .s i{position:absolute;left:3px;top:2px;font:800 9px var(--en);font-style:normal;color:var(--mute)}
.bar{position:relative;height:10px;background:#0a0d0f;outline:1px solid var(--seam)}
.bar>div{position:absolute;left:0;top:0;bottom:0}
.wm{position:absolute;right:20px;bottom:30px;font:900 150px/1 var(--en);font-stretch:125%;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.06);letter-spacing:.02em;pointer-events:none}
/* 站点外壳 */
.shell{position:absolute;inset:0;background-color:var(--hull0)}
.shell.plate{background-image:linear-gradient(rgba(59,65,70,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(59,65,70,.35) 1px,transparent 1px);background-size:64px 64px}
.shell.grate{background-image:repeating-linear-gradient(45deg,rgba(68,75,81,.18) 0 1px,transparent 1px 8px)}
.shell.screen{background:#0b1215 repeating-linear-gradient(0deg,rgba(63,210,242,.035) 0 1px,transparent 1px 3px)}
.top{position:absolute;left:0;right:0;top:0;height:60px;background:rgba(8,11,13,.92);display:flex;align-items:center;gap:10px;padding:0 16px 0 14px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--dc) 20%,var(--dc) 80%,transparent)}
.sq{width:44px;height:44px;background:var(--hull3);display:grid;place-items:center;font-size:20px;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.top .blk{width:6px;height:44px;background:var(--dc);clip-path:polygon(0 8px,100% 0,100% 100%,0 100%);margin-left:6px}
.top .t b{display:block;font:900 22px/1.1 var(--cn)}
.top .t i{font:600 10px var(--en);font-style:normal;font-stretch:125%;letter-spacing:.24em;color:var(--mute)}
.pill{display:flex;align-items:center;gap:8px;background:#000;padding:0 12px;height:32px;font:700 14px var(--en)}
.foot{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(8,11,13,.85);font:600 10px var(--en);letter-spacing:.24em;color:var(--dim)}
.foot img{width:16px;height:16px;image-rendering:pixelated;opacity:.7}
.kc{font:800 10px var(--en);background:var(--hull3);color:var(--fg);padding:2px 6px;letter-spacing:0}
.panel{position:absolute;background:rgba(22,27,31,.88);outline:1px solid var(--seam);outline-offset:-1px}
.card{position:absolute;background:var(--hull2);clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
/* 白舱 */
.med{--fg:var(--med-ink);--mute:#4d5c63;--dim:#7b8a91;--seam:var(--med-line);--hull2:#ffffff;--hull3:#dfe6e8;color:var(--med-ink)}
.med .shell{background:var(--med-bg) linear-gradient(rgba(47,191,166,.08) 1px,transparent 1px) 0 0/32px 32px}
.med .panel{background:var(--med-panel)}
.med .sec::before{background:var(--d-med)}
.med .grid{background-color:#f7fafa;background-image:linear-gradient(var(--med-line) 1px,transparent 1px),linear-gradient(90deg,var(--med-line) 1px,transparent 1px)}
.med .top{background:#f4f7f8;color:var(--med-ink)}
.med .sq{background:#dfe6e8;color:var(--med-ink)}
.med .pill{background:#1b2328;color:#fff}
.med .foot{background:#c9d2d6;color:#6d7c83}
.med .wm{-webkit-text-stroke-color:rgba(27,35,40,.07)}
.med .tab{background:#dfe6e8;color:#4d5c63}.med .tab.on{background:var(--med-ink);color:#fff}
/* swatches */
.sw{position:absolute;width:132px}
.sw .c{height:56px;outline:1px solid var(--seam)}
.sw b{display:block;font:700 12px var(--cn);margin-top:6px}
.sw i{font:600 11px var(--en);font-style:normal;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.55}}}
</style>

<h1>罗德岛舰内界面<small>UI V2.0 · RHODES ISLAND INTERIOR</small></h1>
<p class="lede">界面就是舰上那台终端的屏幕：蓝灰舰板、舱壁切角、全息青灯带、部门色标识；方舟客户端的写法照旧。装备栏照恐怖黎明排 8 槽。对应《界面美术与布局策划案_v2_0》。</p>
<nav id="nav" role="tablist"></nav>
<div class="frame" id="frame"><div id="stage"></div></div>
<div class="note" id="note"></div>

<script>
const IMG='img/';
const S=document.getElementById('stage'),F=document.getElementById('frame');
function fit(){S.style.transform=`scale(${F.clientWidth/1280})`}
new ResizeObserver(fit).observe(F);

const at=(x,y,w,h)=>`left:${x}px;top:${y}px;${w!=null?`width:${w}px;`:''}${h!=null?`height:${h}px;`:''}`;
const TC=['var(--t0)','var(--t1)','var(--t2)','var(--special)'];
// 部位剪影（空槽）
const SIL={
 head:'<path d="M20 6c-8 0-13 6-13 14v6h26v-6c0-8-5-14-13-14zM9 28h22v5H9z"/>',
 chest:'<path d="M10 4l6 4h8l6-4 8 6-4 10-4-2v18H10V18l-4 2-4-10z"/>',
 hands:'<path d="M12 6h4v12h2V4h4v14h2V6h4v16c0 7-4 12-10 12s-10-5-10-10v-8h4z"/>',
 legs:'<path d="M10 4h20l-1 32h-7l-2-20-2 20h-7z"/>',
 feet:'<path d="M12 4h8v20l12 4v8H8V24z"/>',
 amulet:'<path d="M8 4c0 10 5 16 12 16S32 14 32 4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 18l6 8-6 10-6-10z"/>',
 ring:'<circle cx="20" cy="22" r="10" fill="none" stroke="currentColor" stroke-width="4"/><path d="M16 6h8l3 6H13z"/>',
 weapon:'<path d="M18 2h4v26h-4zM12 28h16v3H12zM18 31h4v7h-4z"/>'};
const sil=(k,s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40" fill="#9aa7ae" color="#9aa7ae">${SIL[k]}</svg>`;
function slot(x,y,w,h,k,cap,item,opt={}){
  const tc=item?TC[item.t]:'';
  const img=item?`<img src="${IMG}${item.i}.png" style="${item.rot?'transform:rotate(-90deg);':''}width:${item.w}px;height:${item.h}px">`:sil(k,Math.min(w,h)>60?48:28);
  return `<div class="slot${item?' on':''}" style="${at(x,y,w,h)}--tc:${tc}">${img}${opt.cap!==false?`<span class="cap">${cap}</span>`:''}${opt.ins?'<span class="ins"></span>':''}</div>`;
}
function it(gx,gy,cw,ch,icon,t,n,ox=0,oy=0){
  const [iw,ih]=[cw==1?32:72,ch==1?32:72];
  return `<div class="it" style="${at(ox+gx*40,oy+gy*40,cw*40,ch*40)}--tc:${TC[t]}"><img src="${IMG}${icon}.png" width="${iw}" height="${ih}">${n?`<span class="n">${n}</span>`:''}</div>`;
}
function win(x,y,w,h,{cn,en,dc='var(--holo)',key,tabs,solid}={},body=''){
  const tb=cn?`<div class="tb" style="--dc:${dc}"><div class="blk" style="background:${dc}"></div><div><div class="cnT">${cn}</div><div class="enT">${en}</div></div>${tabs?`<div class="tabs">${tabs.map((t,i)=>`<div class="tab${i==0?' on':''}">${t}</div>`).join('')}</div>`:''}<div class="grow"></div>${key?`<span class="key">${key}</span>`:''}<div class="x">✕</div></div>`:'';
  const r=(l,t)=>`<div class="rivet" style="${l}:4px;${t}:4px"></div>`;
  return `<div class="win cut${solid?' solid':''}" style="${at(x,y,w,h)}"><div class="in cut">${tb}<div class="abs" style="left:0;top:${cn?44:0}px;right:0;bottom:0">${body}</div>${r('right','top')}${r('left','bottom')}</div></div>`;
}
const field=()=>`<div class="bgimg" style="background-image:url(${IMG}field_city.png)"></div><div class="dim"></div>`;
function hotbar(){
  const s=['LMB','RMB','SPC','Q','1','2','3','4','5'];const ic=['rhodes_dual_blades','','','potion_a','potion_b','potion_c','','',''];
  return `<div class="hb"><div style="width:200px"><div class="lbl" style="display:flex;justify-content:space-between;color:#fff;font-size:11px"><span>生命</span><span class="num">2400 / 2400</span></div><div class="bar" style="height:12px"><div style="width:100%;background:var(--hp)"></div></div></div>${s.map((k,i)=>`<div class="s"><i>${k}</i>${ic[i]?`<img src="${IMG}${ic[i]}.png" width="${i==0?54:32}" style="image-rendering:pixelated">`:''}</div>`).join('')}<div style="width:200px"><div class="lbl" style="font-size:11px;color:#fff">体力</div><div class="bar"><div style="width:100%;background:#e9eef0"></div></div><div class="lbl" style="font-size:11px;color:#fff;margin-top:4px">剑气</div><div class="bar"><div style="width:66%;background:var(--sp)"></div></div></div></div>`;
}
function shell(dc,cn,en,skin,tabs,pills,body,foot,wm){
  return `<div class="shell ${skin}"></div><div class="top" style="--dc:${dc}"><div class="sq">‹</div><div class="sq">⌂</div><div class="blk"></div><div class="t"><b>${cn}</b><i>${en}</i></div><div style="width:24px"></div>${tabs?`<div class="tabs">${tabs.map((t,i)=>`<div class="tab${i==0?' on':''}" style="padding:10px 20px;font-size:14px">${t}</div>`).join('')}</div>`:''}<div style="flex:1"></div>${pills||`<div class="pill"><span style="width:12px;height:12px;border:3px solid #fff;border-radius:50%"></span>15,510</div><div class="pill" style="background:var(--sp);color:#000">声望 R2</div>`}</div>${wm?`<div class="wm">${wm}</div>`:''}${body}<div class="foot"><img src="${IMG}base_rhodes_logo.png">RHODES ISLAND · ${en}<div style="flex:1"></div>${(foot||[]).map(([k,a])=>`<span class="kc">${k}</span><span style="letter-spacing:0;font-family:var(--cn);font-size:11px;color:var(--mute)">${a}</span>`).join('')}</div>`;
}

// ---- 纸娃娃（恐怖黎明排法） ----
const GEAR={weapon:{i:'twin_fang',w:72,h:32,t:2,rot:1},head:{i:'dust_mask',w:32,h:32,t:1},chest:{i:'rhodes_protective_vest',w:72,h:72,t:2},hands:{i:'shadow_bracer',w:32,h:32,t:0},amulet:{i:'yan_talisman',w:32,h:32,t:1},ring:{i:'tactical_charm',w:32,h:32,t:0}};
function doll(ox,oy,scale=1,{ins=false,g=GEAR}={}){
  const p=(x,y,w,h)=>[ox+x*scale,oy+y*scale,w*scale,h*scale];
  const o={ins};
  return [
   slot(...p(12,12,88,112),'weapon','武器',g.weapon,o),
   slot(...p(12,132,88,136),'chest','胸',g.chest,o),
   slot(...p(12,276,88,112),'legs','腿',g.legs,o),
   `<div class="abs" style="${at(...p(112,12,40,40))}background:var(--hull2);outline:1px solid var(--seam);display:grid;place-items:center;font:800 ${14*scale}px var(--en);color:var(--sp)">E1</div>`,
   slot(...p(156,12,80,80),'head','头',g.head,o),
   slot(...p(240,12,40,40),'amulet','',g.amulet,{...o,cap:false}),
   slot(...p(112,56,40,40),'ring','',g.ring,{...o,cap:false}),
   `<div class="abs" style="${at(...p(108,100,176,240))}">
      <div class="abs pulse" style="left:8%;right:8%;bottom:4%;height:18%;border:2px solid var(--holo);border-radius:50%;box-shadow:0 0 18px rgba(63,210,242,.35) inset"></div>
      <img src="${IMG}base_rhodes_logo.png" class="abs" style="left:50%;bottom:6%;width:${40*scale}px;transform:translateX(-50%) scaleY(.45);opacity:.35;image-rendering:pixelated">
      <img src="${IMG}lappland_sprite.png" class="abs" style="left:50%;bottom:9%;width:${168*scale}px;transform:translateX(-50%);image-rendering:pixelated"></div>`,
   `<div class="abs" style="${at(...p(108,348,176,40))}background:var(--hull2);display:flex;align-items:center;justify-content:space-between;padding:0 ${6*scale}px;font-size:${12*scale}px;white-space:nowrap"><span>精英 1 · Lv 30</span>${scale==1?'<span class="btn" style="height:26px;padding:0 8px;white-space:nowrap">干员<span class="key" style="margin-left:6px;font:800 10px var(--en);background:var(--paper);color:var(--ink);padding:0 4px">C</span></span>':''}</div>`,
   `<div class="abs" style="${at(...p(292,12,88,112))}background:linear-gradient(180deg,#2a2410,var(--hull2));outline:1px solid #5a4a18;outline-offset:-1px;display:grid;place-items:center;text-align:center">
     <div><div style="width:${40*scale}px;height:${40*scale}px;margin:0 auto;background:var(--sp);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"></div>${scale==1?'<div style="font:700 11px var(--cn);margin-top:6px">幼狼之牙</div><div style="font:700 9px var(--cn);color:#111;background:var(--green);display:inline-block;padding:0 4px;margin-top:3px">攻击回复</div>':''}</div></div>`,

const nav=document.getElementById('nav'),note=document.getElementById('note');
function show(id){
  const s=SCREENS.find(x=>x.id===id)||SCREENS[0];
  S.className=s.cls||'';S.innerHTML=s.html();
  note.innerHTML=s.note.map(([h,t])=>`<div><b>${h}</b><br>${t}</div>`).join('');
  [...nav.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===s.id));
  try{localStorage.setItem('uiv2',s.id)}catch(e){}
  if(location.hash.slice(1)!==s.id) history.replaceState(null,'','#'+s.id);
}
SCREENS.forEach(s=>{const b=document.createElement('button');b.textContent=s.name;b.dataset.id=s.id;b.setAttribute('role','tab');b.onclick=()=>show(s.id);nav.appendChild(b)});
let start=location.hash.slice(1);if(!start){try{start=localStorage.getItem('uiv2')}catch(e){}}
show(start||'inv');fit();
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(k==='i')show('inv');if(k==='c')show('char');if(k==='escape')show('set')});
</script>
