<meta charset="utf-8">
<title>罗德岛终端界面</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Saira:wdth,wght@100..125,400..800&display=swap">
<style>
/* 布局：上方选场景；下面是 1280×720 的游戏舞台，按宽度等比缩放。舞台里的按钮可以直接点，场景之间会走真实过场。
   单一深色主题：陆行舰终端。底板 = R1 舰板贴图压暗；全息层 = R6 屏幕贴图；警示条 = R4；远景 = R9 荒野。 */
:root{
  color-scheme:dark;
  --void:#07090b; --hull:#0e1215; --glass:rgba(12,16,19,.82); --plate:#1a2126; --plate2:#242c32;
  --seam:#3b4146; --seamhi:#6b7880; --fg:#eef3f5; --mute:#97a4ab; --dim:#5c686f;
  --holo:#3fd2f2; --holo2:#9cecff; --blue:#0098dc; --haz:#e8b730; --sp:#f5c000; --hp:#27a6ef; --red:#e23c3c; --ori:#e0782a; --green:#8fc31f;
  --t0:#9a9a9a; --t1:#16a2e8; --t2:#ffc400; --t3:#c48cff;
  --pink:#ff5fa2; --med:#2fbfa6;
  --cn:"Noto Sans SC","Microsoft YaHei",sans-serif; --en:"Saira","Bahnschrift","Arial Narrow",sans-serif;
}
html,body{background:var(--void);color:var(--fg)}
body{font-family:var(--cn);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
header h1{font:900 22px var(--cn);margin:0}
header span{font:600 11px var(--en);font-stretch:125%;letter-spacing:.24em;color:var(--mute)}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
nav button{font:700 13px var(--cn);color:var(--mute);background:var(--plate);border:0;padding:8px 12px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
nav button[aria-selected="true"]{background:var(--holo);color:#04161c}
nav button:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
.frame{width:100%;max-width:1280px;aspect-ratio:16/9;position:relative;overflow:hidden;background:#000;outline:1px solid var(--seam)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;user-select:none}
.hint{max-width:1280px;margin-top:10px;color:var(--mute);font-size:13px;line-height:1.6}
.hint kbd{font:700 11px var(--en);background:var(--plate2);color:var(--fg);padding:1px 6px}

#stage *{box-sizing:border-box}
.a{position:absolute}
.px{image-rendering:pixelated}
canvas#dust{position:absolute;inset:0;pointer-events:none;z-index:5}
#scene{position:absolute;inset:0}
.layer{position:absolute;inset:0}

/* 背景 */
.bg{position:absolute;inset:-20px;background-size:cover;background-position:center;image-rendering:pixelated}
.bg.blur{filter:blur(6px) brightness(.45) saturate(.8)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.75) 100%)}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none;z-index:6}

/* 面板：舰板贴图 + 压暗玻璃 + 切角 */
.pn{position:absolute}
.pn>.body{position:absolute;inset:0;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  background:linear-gradient(180deg,rgba(14,18,21,.90),rgba(10,13,16,.94)),url(img/base_deck.png) 0 0/256px 256px;image-rendering:pixelated}
.pn>.edge{position:absolute;inset:0;pointer-events:none;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  background:linear-gradient(135deg,var(--seamhi),var(--seam) 25%,var(--seam) 75%,#2a3035);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px}
.pn.glass>.body{background:linear-gradient(180deg,rgba(12,16,19,.78),rgba(8,11,13,.86))}
.pn .inner{position:absolute;inset:0}
.brk{position:absolute;width:14px;height:14px;border-color:var(--holo);border-style:solid;opacity:.9;pointer-events:none}
.brk.tl{left:-5px;top:-5px;border-width:2px 0 0 2px}.brk.tr{right:-5px;top:-5px;border-width:2px 2px 0 0}
.brk.bl{left:-5px;bottom:-5px;border-width:0 0 2px 2px}.brk.br{right:-5px;bottom:-5px;border-width:0 2px 2px 0}
.hdr{position:absolute;left:0;right:0;top:0;height:48px;display:flex;align-items:center;gap:12px;padding:0 10px 0 22px;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent)}
.hdr::before{content:"";position:absolute;left:0;top:0;width:72px;height:6px;background:url(img/base_hazard.png) 0 0/48px 24px;image-rendering:pixelated;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.hdr::after{content:"";position:absolute;left:12px;right:0;bottom:0;height:1px;background:linear-gradient(90deg,var(--dc,var(--holo)),transparent 70%);box-shadow:0 0 8px var(--dc,var(--holo))}
.hdr .ic{width:26px;height:26px}
.hdr .cnT{font:900 19px/1 var(--cn);letter-spacing:.04em}
.hdr .enT{font:600 9px/1 var(--en);font-stretch:125%;letter-spacing:.3em;color:var(--mute);margin-top:4px;text-transform:uppercase}
.hdr .ser{font:500 9px var(--en);letter-spacing:.2em;color:var(--dim)}
.hdr .key{font:800 11px var(--en);background:var(--fg);color:#000;padding:2px 6px}
.hdr .x{width:30px;height:30px;display:grid;place-items:center;color:var(--mute);cursor:pointer;font-size:16px}
.hdr .x:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.grow{flex:1}
.sec{display:flex;align-items:center;gap:8px;font:900 13px var(--cn)}
.sec::before{content:"";width:3px;height:12px;background:var(--holo);box-shadow:0 0 6px var(--holo)}
.sec i{font:600 9px var(--en);font-style:normal;font-stretch:125%;letter-spacing:.24em;color:var(--dim)}
.micro{font:500 9px var(--en);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.num{font-family:var(--en);font-weight:700;font-variant-numeric:tabular-nums}

/* 打开动画 */
.open{animation:wipe .52s cubic-bezier(.2,.8,.2,1) both}
@keyframes wipe{0%{clip-path:inset(0 0 100% 0);filter:brightness(2.2)}60%{filter:brightness(1.2)}100%{clip-path:inset(-20px -20px -20px -20px);filter:none}}
.open::after{content:"";position:absolute;left:-10px;right:-10px;height:2px;top:0;background:var(--holo);box-shadow:0 0 16px 4px rgba(63,210,242,.6);animation:scanbar .52s cubic-bezier(.2,.8,.2,1) both;pointer-events:none;z-index:9}
@keyframes scanbar{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
.open .brk{animation:brk .5s .25s cubic-bezier(.3,1.6,.5,1) both}
@keyframes brk{0%{opacity:0;transform:scale(2.2)}100%{opacity:.9;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.slideL{animation:slideL .55s cubic-bezier(.2,.8,.2,1) both}@keyframes slideL{0%{opacity:0;transform:translateX(-60px)}100%{opacity:1;transform:none}}
.slideR{animation:slideR .55s cubic-bezier(.2,.8,.2,1) both}@keyframes slideR{0%{opacity:0;transform:translateX(60px)}100%{opacity:1;transform:none}}

/* 全息环 */
.spin{animation:spin 30s linear infinite}.spinR{animation:spin 46s linear infinite reverse}.spinF{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.flick{animation:flick 5s steps(1) infinite}@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
.breathe{animation:br 2.6s ease-in-out infinite}@keyframes br{50%{opacity:.45}}
.holoTex{position:absolute;background:url(img/base_screen.png) 0 0/512px 256px;image-rendering:pixelated;mix-blend-mode:screen;opacity:.16;animation:holoScroll 40s linear infinite}
@keyframes holoScroll{to{background-position:-512px 0}}

/* 格子与物品 */
.grid{position:absolute;background-color:rgba(4,7,9,.7);background-image:linear-gradient(rgba(59,65,70,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(59,65,70,.9) 1px,transparent 1px);background-size:40px 40px;box-shadow:inset 0 0 0 1px var(--seam)}
.it{position:absolute;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.it img{image-rendering:pixelated;position:relative;z-index:1;transition:transform .15s}
.it::before{content:"";position:absolute;inset:1px;background:linear-gradient(0deg,var(--tc) -50%,transparent 60%);opacity:.5}
.it::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:3px;background:var(--tc);box-shadow:0 0 6px var(--tc)}
.it:hover{box-shadow:inset 0 0 0 1px var(--holo),0 0 10px rgba(63,210,242,.4);z-index:3}
.it:hover img{transform:scale(1.08)}
.it .n{position:absolute;right:2px;bottom:5px;font:800 10px var(--en);background:#000;padding:0 3px;z-index:2}
.sheen{display:none}

.slot{position:absolute;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--tc,#000) 35%,transparent),transparent 70%),linear-gradient(180deg,#151b1f,#0d1114);
  box-shadow:inset 0 0 0 1px var(--seam),inset 0 1px 0 0 rgba(255,255,255,.06);transition:box-shadow .15s}
.slot.on{box-shadow:inset 0 0 0 1px var(--tc),inset 0 0 18px -6px var(--tc)}
.slot:hover{box-shadow:inset 0 0 0 1px var(--holo),0 0 14px rgba(63,210,242,.35)}
.slot:hover .sb{opacity:1;transform:none}
.slot .sb{position:absolute;inset:-4px;pointer-events:none;opacity:0;transform:scale(1.15);transition:.18s}
.slot .sb::before,.slot .sb::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--holo)}
.slot .sb::before{left:0;top:0;border-width:2px 0 0 2px}.slot .sb::after{right:0;bottom:0;border-width:0 2px 2px 0}
.slot img{image-rendering:pixelated;position:relative;z-index:1}
.slot svg{opacity:.28}
.slot .cap{position:absolute;left:5px;top:3px;font:700 10px var(--cn);color:var(--dim)}
.slot .ins{position:absolute;right:4px;top:4px;width:11px;height:12px;background:#4fd1c5;clip-path:polygon(50% 0,100% 25%,100% 70%,50% 100%,0 70%,0 25%);z-index:2}

/* 按钮 */
.btn{position:absolute;display:grid;place-items:center;cursor:pointer;font:700 13px var(--cn);color:var(--fg);
  background:linear-gradient(180deg,#2b343a,#1d2428);box-shadow:inset 0 0 0 1px var(--seam),inset 0 1px 0 rgba(255,255,255,.08);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);transition:filter .12s,transform .12s}
.btn:hover{filter:brightness(1.3)}.btn:active{transform:translateY(1px)}
.btn.inl{position:relative;display:inline-flex;align-items:center;white-space:nowrap;height:26px;padding:0 10px;font-size:12px}
.btn.on{background:var(--fg);color:#000;box-shadow:none}
.go{position:absolute;cursor:pointer;overflow:hidden;background:linear-gradient(100deg,#0089c9,#00a6ec);clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);transition:filter .15s}
.go:hover{filter:brightness(1.15)}
.go::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 26px,rgba(255,255,255,.09) 26px 28px);animation:stripes 1.6s linear infinite}
@keyframes stripes{to{background-position:57px 0}}
.go .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.go b{font:900 28px/1 var(--cn);letter-spacing:.08em}
.go i{font:700 10px var(--en);font-style:normal;letter-spacing:.4em;margin-top:6px;opacity:.9}
.go .chev{position:absolute;right:28px;top:50%;transform:translateY(-50%);z-index:1;font:900 26px var(--en);animation:chev 1.2s ease-in-out infinite}
@keyframes chev{50%{transform:translate(6px,-50%)}}

.stat{display:flex;justify-content:space-between;align-items:center;height:23px;font-size:13px;color:var(--mute);border-bottom:1px solid rgba(59,65,70,.35)}
.stat b{font:700 13px var(--en);color:var(--fg);font-variant-numeric:tabular-nums}
.stat b small{color:var(--green);margin-left:5px;font-size:12px}
.bar{position:absolute;background:rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px var(--seam)}
.bar .f{position:absolute;left:1px;top:1px;bottom:1px;transition:width .6s}
.bar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 19px,rgba(0,0,0,.55) 19px 20px)}

/* 提示卡 */
.tip{position:absolute;width:244px;z-index:20;pointer-events:none;padding:12px 14px;font-size:12px;line-height:1.75;
  background:linear-gradient(180deg,rgba(14,19,22,.97),rgba(8,11,13,.98));box-shadow:inset 0 0 0 1px var(--tc),0 10px 30px rgba(0,0,0,.6);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);animation:rise .2s both}
.tip .tg{font:700 10px var(--cn);color:var(--mute);display:flex;justify-content:space-between}
.tip .nm{font:900 15px var(--cn);color:var(--tc);text-shadow:0 0 10px color-mix(in srgb,var(--tc) 50%,transparent)}
.tip .ln{color:var(--mute)}.tip .up{color:var(--green)}.tip .dn{color:var(--red)}
.tip .fl{font-style:italic;color:var(--dim);margin-top:4px;border-top:1px solid var(--seam);padding-top:4px}

/* HUD */
.hb{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:5px;z-index:4}
.hb .s{width:56px;height:56px;position:relative;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(26,33,38,.92),rgba(10,13,15,.95));box-shadow:inset 0 0 0 1px var(--seam),inset 0 1px 0 rgba(255,255,255,.07)}
.hb .s i{position:absolute;left:3px;top:2px;font:800 9px var(--en);font-style:normal;color:var(--mute)}
.hb .s .q{position:absolute;right:3px;top:2px;font:800 10px var(--en)}
.hb .s .cd{position:absolute;left:1px;right:1px;top:1px;background:rgba(0,0,0,.72);display:grid;place-items:center;font:800 15px var(--en)}
.hb .s.rdy{box-shadow:inset 0 0 0 1px var(--sp),0 0 12px rgba(245,192,0,.5)}
.side{width:206px;position:relative;height:56px}
.dmg{position:absolute;font:900 22px var(--en);text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;animation:dmg 1s ease-out forwards;z-index:4}
@keyframes dmg{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-8px) scale(1.15)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 16px 7px 0;background:rgba(8,11,13,.88);box-shadow:inset 0 0 0 1px var(--seam);animation:rise .3s both;z-index:4}
.toast b{background:var(--blue);font:800 11px var(--en);padding:8px 10px;letter-spacing:.12em}

/* 过场 */
.wipe{position:absolute;inset:0;z-index:50;pointer-events:none}
.wipe .p{position:absolute;top:-10%;bottom:-10%;width:75%;background:#07090b}
.wipe .p.l{left:-80%;transform:skewX(-14deg);box-shadow:8px 0 0 var(--haz)}
.wipe .p.r{right:-80%;transform:skewX(-14deg);box-shadow:-8px 0 0 var(--holo)}
.wipe.in .p.l{animation:wl .38s cubic-bezier(.7,0,.3,1) forwards}.wipe.in .p.r{animation:wr .38s cubic-bezier(.7,0,.3,1) forwards}
.wipe.out .p.l{left:-5%;animation:wl2 .42s cubic-bezier(.7,0,.3,1) forwards}.wipe.out .p.r{right:-5%;animation:wr2 .42s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wl{to{left:-5%}}@keyframes wr{to{right:-5%}}@keyframes wl2{to{left:-90%}}@keyframes wr2{to{right:-90%}}
.wipe .logo{position:absolute;left:50%;top:50%;width:72px;transform:translate(-50%,-50%);opacity:0;image-rendering:pixelated}
.wipe.in .logo{animation:logoIn .38s .2s forwards}@keyframes logoIn{to{opacity:.9}}
.wipe.out .logo{opacity:.9;animation:logoOut .2s forwards}@keyframes logoOut{to{opacity:0}}


.opc{position:relative;width:100px;height:160px;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#1b2227 0%,#12171a 55%,color-mix(in srgb,var(--oc) 28%,#12171a) 100%);
  box-shadow:inset 0 0 0 1px var(--seam);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);transition:box-shadow .15s,transform .15s}
.opc:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--oc)}
.opc img{position:absolute;left:50%;bottom:34px;height:112px;transform:translateX(-50%);transition:transform .2s}

.opc .cls{position:absolute;left:0;top:0;background:#000;font:900 11px var(--cn);padding:2px 5px}
.opc .el{position:absolute;right:4px;top:3px;font:800 11px var(--en);color:var(--sp)}
.opc .hurt{position:absolute;right:0;top:20px;background:var(--red);font:900 10px var(--cn);padding:1px 5px}
.opc .nm{position:absolute;left:0;right:0;bottom:0;height:34px;padding:2px 7px;background:rgba(5,7,9,.85);box-shadow:inset 0 -3px 0 var(--oc)}
.opc .nm b{display:block;font:900 13px/1.3 var(--cn);white-space:nowrap}
.opc .nm span{font-size:10px;color:var(--mute)}
.opc .ck{position:absolute;right:0;bottom:34px;width:22px;height:22px;display:grid;place-items:center;background:var(--oc);color:#000;font:900 13px var(--en);opacity:0;transform:scale(.4);transition:.18s}
.opc .k{position:absolute;left:4px;bottom:38px;font:800 10px var(--en);color:var(--dim)}
.opc.sel{box-shadow:inset 0 0 0 2px var(--oc),inset 0 0 26px -8px var(--oc)}
.opc.sel .ck{opacity:1;transform:none}
.opchip{position:relative;width:38px;height:44px;cursor:pointer;overflow:hidden;background:linear-gradient(180deg,#1b2227,color-mix(in srgb,var(--oc) 30%,#12171a));box-shadow:inset 0 0 0 1px var(--seam);transition:transform .15s}
.opchip img{position:absolute;left:50%;top:-2px;height:150px;transform:translateX(-50%)}
.opchip:hover{transform:translateY(-2px)}
.opchip.sel{box-shadow:inset 0 0 0 2px var(--oc),0 0 10px color-mix(in srgb,var(--oc) 60%,transparent)}
.opchip .hd{position:absolute;right:0;top:0;width:8px;height:8px;background:var(--red)}

.it .pt{position:absolute;left:1px;bottom:4px;z-index:2;background:#fff;color:#000;font:800 8px/11px var(--en);letter-spacing:-.02em;padding:0 3px;display:flex;align-items:center;gap:2px;clip-path:polygon(0 0,100% 0,100% 55%,calc(100% - 4px) 100%,0 100%);white-space:nowrap}
.it .stk{position:absolute;right:2px;top:1px;z-index:2;font:800 9px var(--en);color:#cfd8dc;text-shadow:0 1px 0 #000}
.it .lk{position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(135deg,rgba(232,183,48,.22) 0 4px,transparent 4px 8px);font:800 9px var(--en);color:var(--haz);display:flex;gap:2px;padding:2px;align-items:flex-start}
.it .so{position:absolute;left:-6px;right:-6px;top:14px;z-index:2;background:rgba(226,60,60,.85);font:900 9px var(--cn);text-align:center;transform:rotate(-18deg)}
.it.pick{box-shadow:inset 0 0 0 2px var(--holo),0 0 12px rgba(63,210,242,.5);z-index:3}
.medskin{color:#1b2328}
.medskin .tleft{background:linear-gradient(180deg,#f4f7f8,#e3eaec)!important;box-shadow:inset 0 0 0 1px #b9c5ca!important}
.medskin .fadeL{background:linear-gradient(0deg,#e3eaec 70%,transparent)!important}
.medskin #dealBar .lbl{color:#7b8a91}
.medskin .topbar{background:#f4f7f8!important;color:#1b2328}
.medskin .topbar .btn{background:#dfe6e8;color:#1b2328;box-shadow:none}
.medskin .pn>.body{background:#eef2f3}
.medskin .pn>.edge{background:#b9c5ca}
.medskin .brk{border-color:var(--med)}
.medskin .grid{background-color:#f7fafa;background-image:linear-gradient(#c8d2d6 1px,transparent 1px),linear-gradient(90deg,#c8d2d6 1px,transparent 1px);box-shadow:inset 0 0 0 1px #b9c5ca}
.medskin .sec::before{background:var(--med);box-shadow:none}
.medskin .lbl,.medskin .micro{color:#5b6a71}
.medskin #dealBar{background:#fff!important;box-shadow:inset 0 0 0 1px #b9c5ca!important}
.medskin .go{background:linear-gradient(100deg,#22a892,var(--med))}
.medskin .btn{background:#dfe6e8;color:#1b2328;box-shadow:inset 0 0 0 1px #b9c5ca}
@media (prefers-reduced-motion:reduce){#stage *,#stage *::before,#stage *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}}

}

  return [slot(...p(12,12,88,112),'weapon','武器',opt),slot(...p(12,132,88,136),'chest','胸',opt),slot(...p(12,276,88,112),'legs','腿',opt),

function selectOp(i){
  if(i<0||i>=OPS.length)return;pickOp=i;
  SC.querySelectorAll('[data-op]').forEach(el=>el.classList.toggle('sel',+el.dataset.op===i));

function baseTop(cn,en,dc,tabs){return `<div class="a slideL topbar" style="left:0;right:0;top:0;height:62px;z-index:3;background:linear-gradient(180deg,rgba(7,9,11,.96),rgba(7,9,11,.85));display:flex;align-items:center;gap:10px;padding:0 16px 0 14px">
  <div class="btn" data-act="go:title" style="position:relative;width:44px;height:44px;font-size:20px">‹</div><div class="btn" data-act="go:title" style="position:relative;width:44px;height:44px;font-size:18px">⌂</div>
  <div style="width:6px;height:44px;margin-left:8px;background:${dc};box-shadow:0 0 10px ${dc};clip-path:polygon(0 8px,100% 0,100% 100%,0 100%)"></div>
  <div><div style="font:900 22px/1.1 var(--cn)" data-decode>${cn}</div><div class="micro" style="letter-spacing:.3em">${en}</div></div>
  ${tabs?`<div style="display:flex;gap:2px;margin-left:24px">${tabs.map((t,i)=>`<span class="btn" style="position:relative;height:36px;padding:0 22px;font-size:14px;${i==0?'background:var(--fg);color:#000;box-shadow:none':''}">${t}</span>`).join('')}</div>`:''}
  <div class="grow"></div><div style="display:flex;gap:4px;margin-right:${tabs&&cn=='整备台'?'170px':'0'}"><div class="num" style="background:#000;padding:7px 12px;box-shadow:inset 0 0 0 1px var(--seam)">⦿ <span data-count="15510">15510</span></div><div class="num" style="background:var(--sp);color:#000;padding:7px 12px">声望 R2</div></div>
  <div class="a" style="left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,transparent,${dc} 15%,${dc} 85%,transparent);box-shadow:0 0 10px ${dc}"></div></div>`}
function baseFoot(t,keys,dc='var(--holo)'){return `<div class="a" style="left:0;right:0;bottom:0;height:30px;z-index:3;background:rgba(7,9,11,.9);display:flex;align-items:center;gap:10px;padding:0 16px"><img src="${IMG}base_rhodes_logo.png" class="px" width="16" style="opacity:.7"><span class="micro" style="letter-spacing:.3em">${t}</span><span class="micro" id="coord2"></span><div class="grow"></div>${keys.map(([k,a])=>`<span style="font:800 10px var(--en);background:#2a3238;padding:2px 6px">${k}</span><span style="font-size:11px;color:var(--mute)">${a}</span>`).join('')}</div>`}

// ---------- 运行 ----------
let cur='title',dmgTimer=null,CURGOODS=null;
const order=['title','wb','dep','launch','field','inv','char','store','pharm','rat','cannot'];
const nav=document.getElementById('nav');
order.forEach(k=>{const b=document.createElement('button');b.textContent=SCENES[k].name;b.dataset.k=k;b.onclick=()=>go(k);nav.appendChild(b)});
function render(k){
  cur=k;clearInterval(dmgTimer);SC.innerHTML=SCENES[k].html();
  [...nav.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
  SC.querySelectorAll('[data-decode]').forEach(decode);SC.querySelectorAll('[data-count]').forEach(countUp);
  SCENES[k].mount&&SCENES[k].mount();
  try{if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k)}catch(e){}
}
function go(k){
  if(k===cur)return;
  const quick=(cur==='field'||cur==='inv'||cur==='char')&&(k==='field'||k==='inv'||k==='char');
  if(quick||RM){render(k);return}
  const w=document.createElement('div');w.className='wipe in';w.innerHTML=`<div class="p l"></div><div class="p r"></div><img class="logo" src="${IMG}base_rhodes_logo.png">`;S.appendChild(w);
  setTimeout(()=>{render(k);w.className='wipe out';setTimeout(()=>w.remove(),450)},520);
}
const GLYPH='アイウエオカキクケコ01#$%&ABCDEFRHODES';
function decode(el){if(RM)return;const t=el.textContent;let f=0;const n=t.length;const id=setInterval(()=>{f++;el.textContent=[...t].map((c,i)=>i<f/2?c:(c===' '?' ':GLYPH[Math.random()*GLYPH.length|0])).join('');if(f>=n*2){clearInterval(id);el.textContent=t}},28)}
function countUp(el){if(RM)return;const v=+el.dataset.count;if(!v)return;const suf=el.dataset.suffix||'';const kids=[...el.childNodes].slice(1).map(n=>n.cloneNode(true));const t0=performance.now();const fmt=x=>(v>=1000?Math.round(x).toLocaleString('en-US'):(v%1?x.toFixed(1):Math.round(x)))+suf;
  (function step(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(v*e);kids.forEach(k=>el.appendChild(k.cloneNode(true)));if(p<1)requestAnimationFrame(step)})(t0)}
function startDmg(){if(RM)return;const L=document.getElementById('dmgLayer');if(!L)return;dmgTimer=setInterval(()=>{const d=document.createElement('div');d.className='dmg';const crit=Math.random()<.25;d.textContent=crit?(1200+Math.random()*600|0):(300+Math.random()*300|0);d.style.color=crit?'var(--sp)':(Math.random()<.4?'#9fd7ff':'#fff');if(crit)d.style.fontSize='30px';d.style.left=(720+Math.random()*120)+'px';d.style.top=(300+Math.random()*60)+'px';L.appendChild(d);setTimeout(()=>d.remove(),1000)},620)}
// 悬停提示
let tipEl=null;
S.addEventListener('mouseover',e=>{const t=e.target.closest('[data-item]');if(!t){tipEl&&tipEl.remove();tipEl=null;return}if(tipEl&&tipEl.dataset.for===t.dataset.item+t.style.left)return;tipEl&&tipEl.remove();
  const id=t.dataset.item,d=ITEMS[id],sr=S.getBoundingClientRect(),r=t.getBoundingClientRect(),sc=sr.width/1280;let x=(r.right-sr.left)/sc+8,y=(r.top-sr.top)/sc;
  const card=(dd,tag)=>`<div class="tip" style="--tc:${TC[dd.t]};position:relative"><div class="tg"><span>${tag}</span><span>${dd.slot}</span></div><div class="nm">${dd.n}</div>${dd.l.map(l=>`<div class="ln">${l}</div>`).join('')}${(dd.sd||[]).map(l=>`<div class="dn">副作用 · ${l}</div>`).join('')}${dd.f?`<div class="fl">${dd.f}</div>`:''}</div>`;
  const cmp=d.cmp&&ITEMS[d.cmp];const w=cmp?496:244;if(x+w>1270)x=(r.left-sr.left)/sc-w-8;if(y+220>710)y=490;
  tipEl=document.createElement('div');tipEl.className='a';tipEl.dataset.for=id+t.style.left;tipEl.style.cssText=`left:${x}px;top:${y}px;display:flex;gap:8px;z-index:40;pointer-events:none`;
  tipEl.innerHTML=card(d,t.classList.contains('slot')?'已装备':'物品')+(cmp?card(cmp,'已装备'):'');S.appendChild(tipEl)});
S.addEventListener('mouseleave',()=>{tipEl&&tipEl.remove();tipEl=null});
S.addEventListener('click',e=>{const gd=e.target.closest('[data-good]');if(gd&&CURGOODS){SC.querySelectorAll('.gd').forEach(x=>x.classList.remove('pick'));gd.classList.add('pick');const db=document.getElementById('dealBar');if(db&&!db.textContent.includes('合计'))db.innerHTML=dealBar(CURGOODS[+gd.dataset.good]);return}const o=e.target.closest('[data-op]');if(o){selectOp(+o.dataset.op);return}const a=e.target.closest('[data-act]');if(!a)return;const v=a.dataset.act;
  if(v.startsWith('go:'))go(v.slice(3));else if(v==='close')go('field');else if(v==='inv'||v==='char')go(cur===v?'field':v)});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((cur==='dep'||cur==='wb')&&/^[1-9]$/.test(k)){selectOp(+k-1);return}if(!['field','inv','char'].includes(cur))return;if(k==='i')go(cur==='inv'?'field':'inv');if(k==='c')go(cur==='char'?'field':'char');if(k==='escape')go('field')});
// 环境粒子
const cv=document.getElementById('dust'),cx=cv.getContext('2d');const P=[...Array(70)].map(()=>({x:Math.random()*1280,y:Math.random()*720,v:.1+Math.random()*.35,s:Math.random()*1.8+.4,a:Math.random()*.5+.1,h:Math.random()<.3}));
(function tick(){cx.clearRect(0,0,1280,720);if(!RM)for(const p of P){p.y-=p.v;p.x+=Math.sin(p.y/60)*.2;if(p.y<-5){p.y=725;p.x=Math.random()*1280}cx.fillStyle=p.h?`rgba(63,210,242,${p.a})`:`rgba(220,230,235,${p.a*.6})`;cx.fillRect(p.x,p.y,p.s,p.s)}requestAnimationFrame(tick)})();
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=new Date().toISOString().slice(0,19).replace('T',' ');const g=document.getElementById('coord');if(g)g.textContent=`N 37.${(Math.random()*9999|0)} · E 112.${(Math.random()*9999|0)} · SPD 42 KM/H`},500);
let start=location.hash.slice(1);render(SCENES[start]?start:'title');fit();
</script>
