<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>UC UE v1 素材检查</title>
<style>
*{box-sizing:border-box}body{margin:32px;background:#0e1215;color:#dfe4e6;font:15px system-ui}img{image-rendering:pixelated}h1{font-size:24px}p{color:#9aa2a8}.grid{display:flex;gap:24px;flex-wrap:wrap}.plate{width:420px;height:300px;border:16px solid transparent;border-image:url(../kit/panel_plate.png) 16 fill stretch;padding:12px}.glass{border-image-source:url(../kit/panel_glass.png)}.stage{position:relative;width:256px;height:256px;background:#1a1e22}.stage img{position:absolute;inset:0;filter:drop-shadow(0 0 2px #3fd2f2)}.stage img:nth-child(1){animation:spin 30s linear infinite}.stage img:nth-child(2){animation:spin 20s linear infinite reverse}.stage img:nth-child(3){animation:spin 8s linear infinite}button{border:10px solid transparent;border-image:url(../kit/btn_normal.png) 10 fill stretch;background:none;color:white;padding:8px 24px;cursor:pointer;font:inherit}button:hover{border-image-source:url(../kit/btn_hover.png)}button:active{border-image-source:url(../kit/btn_press.png)}button:disabled{border-image-source:url(../kit/btn_disabled.png);color:#6a737a;cursor:default}.strip{height:48px;border:0 solid transparent;border-width:0 32px;border-image:url(../kit/header_strip.png) 0 32 fill stretch}.go{position:relative;width:260px;height:56px;border:16px solid transparent;border-image:url(../kit/btn_go.png) 16 fill stretch;overflow:hidden}.go:after{content:'';position:absolute;inset:-16px;background:url(../kit/btn_go_stripes.png);opacity:.12;animation:drift 1.2s linear infinite}#sheet{width:min(1200px,100%);height:auto;margin-top:24px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{to{background-position:32px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.paused *{animation-play-state:paused!important}
</style>
<h1>UC / UE v1 · 素材检查</h1><p>独立浏览器预览；不是 Godot 运行证据。纹理与总览均来自交付 PNG。</p>
<button onclick="document.body.classList.toggle('paused')">暂停 / 继续</button><p>面板边距 16；下方演示 420×300 拉伸。玻璃下方棋盘用于观察中心透明度。</p>
<div class="grid"><div class="plate"><div class="strip"></div><p>舰板 · 九宫格拉伸</p><button>普通 / 悬停 / 按下</button><p><button disabled>禁用</button></p><div class="go"></div></div><div style="background:repeating-conic-gradient(#3a4046 0% 25%,#1a1e22 0% 50%) 0/24px 24px"><div class="plate glass"><p>玻璃 · 中心 alpha 0.8</p></div></div><div class="stage"><img src="../kit/holo_ring_ticks.png"><img src="../kit/holo_ring_dash.png"><img src="../kit/holo_ring_arc.png"></div></div>
<img id="sheet" src="contact_sheet.png" alt="36张素材总览">
</html>
